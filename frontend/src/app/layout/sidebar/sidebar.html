<aside class="sidebar">
  <div class="sidebar__brand">
    <!-- logo -->
  </div>

  <div class="sidebar__menu">
    <button type="button" class="sidebar__primary-action">
      {{ 'workspace.chat' | translate }}
    </button>
  </div>

  <section class="sidebar__history">
    <div class="sidebar__history-header">
      <p class="sidebar__history-title">
        {{ 'chat.history' | translate }}
      </p>

      <button
        type="button"
        class="sidebar__history-add"
        (click)="newChat()"
        [attr.aria-label]="'chat.new' | translate"
        [title]="'chat.new' | translate"
      >
        +
      </button>
    </div>

    <app-chat-history></app-chat-history>
  </section>

  <div class="sidebar__spacer"></div>

  <footer class="sidebar__footer">
    <app-connectivity-toolbar></app-connectivity-toolbar>
  </footer>
</aside>

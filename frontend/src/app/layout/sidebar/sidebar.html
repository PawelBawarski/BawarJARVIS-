<aside class="sidebar">
  <div class="brand">
    <div class="brand__icon">J</div>

    <div>
      <strong>J.A.R.V.I.S.</strong>
      <small>
        {{ 'sidebar.personalAssistant' | translate }}
      </small>
    </div>
  </div>

  <nav [attr.aria-label]="'sidebar.menu' | translate">
    <p class="section-title">
      {{ 'sidebar.menu' | translate }}
    </p>

    <div class="nav-item nav-item--active" aria-current="page">
      <span>✦</span>
      <span>{{ 'sidebar.assistant' | translate }}</span>
    </div>

    <p class="section-title">
      {{ 'sidebar.history' | translate }}
    </p>

    <p class="empty-history">
      {{ 'sidebar.emptyHistory' | translate }}
    </p>
  </nav>

  <div class="sidebar-bottom">
    <p class="section-title">
      {{ 'sidebar.settings' | translate }}
    </p>

    <app-preferences-controls />

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      JARVIS Desktop v0.1
    </div>
  </div>
</aside>

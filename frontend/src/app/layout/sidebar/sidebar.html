<aside class="sidebar">
  <div class="brand">
    <div class="brand__icon" aria-hidden="true">J</div>
    <div class="brand__text">
      <strong>J.A.R.V.I.S.</strong>
      <small>{{ 'sidebar.personalAssistant' | translate }}</small>
    </div>
  </div>

  <nav class="sidebar__navigation" [attr.aria-label]="'sidebar.menu' | translate">
    <p class="section-title">{{ 'sidebar.menu' | translate }}</p>
    <button type="button" class="nav-item" [class.nav-item--active]="navigation.activeId() === 'chat'"
      [attr.aria-current]="navigation.activeId() === 'chat' ? 'page' : null"
      (click)="navigation.select('chat')">
      <span aria-hidden="true">✦</span>
      <span>{{ 'sidebar.assistant' | translate }}</span>
    </button>
    <app-chat-history />
  </nav>

  <div class="sidebar-bottom">
    <app-connectivity-toolbar />
    <div class="sidebar-footer">
      <span class="status-dot" aria-hidden="true"></span>
      {{ 'sidebar.webEdition' | translate }}
    </div>
  </div>
</aside>

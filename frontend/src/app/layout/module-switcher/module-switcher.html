<nav class="module-switcher" [attr.aria-label]="'workspace.navigation' | translate">
  <button
    type="button"
    class="module-switcher__arrow"
    [attr.aria-label]="'workspace.previous' | translate"
    (click)="navigation.previous()"
  >
    <span aria-hidden="true">&#8249;</span>
  </button>

  <div class="module-switcher__current" aria-live="polite">
    {{ navigation.activeModule().labelKey | translate }}
  </div>

  <button
    type="button"
    class="module-switcher__arrow"
    [attr.aria-label]="'workspace.next' | translate"
    (click)="navigation.next()"
  >
    <span aria-hidden="true">&#8250;</span>
  </button>

  <label class="module-switcher__label" for="jarvis-module-select">
    {{ 'workspace.select' | translate }}
  </label>

  <select
    #moduleSelect
    id="jarvis-module-select"
    class="module-switcher__select"
    [value]="navigation.activeId()"
    (change)="selectModule(moduleSelect.value)"
  >
    @for (module of navigation.modules; track module.id) {
      <option [value]="module.id">
        {{ module.labelKey | translate }}
      </option>
    }
  </select>
</nav>

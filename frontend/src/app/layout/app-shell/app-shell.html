<app-settings-dialog #settingsDialog />
<app-module-help-dialog />
<div
  class="shell"
  [class.shell--sidebar-open]="sidebarOpen()"
  [class.shell--sidebar-closed]="!sidebarOpen()"
>
  <div
    id="jarvis-sidebar"
    class="sidebar-region"
    [attr.inert]="sidebarOpen() ? null : ''"
    [attr.aria-hidden]="!sidebarOpen()"
  >
    <app-sidebar />
  </div>

  @if (isMobile() && sidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      [attr.aria-label]="'sidebar.closeMenu' | translate"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="shell__main">
    <header class="shell__toolbar">
      <button
        type="button"
        class="menu-toggle"
        aria-controls="jarvis-sidebar"
        [attr.aria-expanded]="sidebarOpen()"
        [attr.aria-label]="(sidebarOpen() ? 'sidebar.closeMenu' : 'sidebar.openMenu') | translate"
        (click)="toggleSidebar()"
      >
        <span aria-hidden="true">
          {{ sidebarOpen() ? '✕' : '☰' }}
        </span>
      </button>

      <app-module-switcher />

      <div class="shell__toolbar-actions">
        <button type="button" class="backend-status" data-testid="backend-connection"
          [class.backend-status--reachable]="backend.status() === 'reachable'"
          [class.backend-status--unavailable]="backend.status() === 'unavailable'"
          [attr.aria-label]="backendStatusKey() | translate"
          [title]="'backend.status.retry' | translate"
          (click)="backend.check()">
          <span class="backend-status__dot" aria-hidden="true"></span>
          <span class="backend-status__label">{{ backendStatusKey() | translate }}</span>
        </button>
        <app-radio-panel />

        <button type="button" class="toolbar-action" data-testid="open-module-help"
          [attr.aria-label]="'toolbar.moduleHelp' | translate"
          [title]="'toolbar.moduleHelp' | translate"
          (click)="help.open(navigation.activeId())">
          <span aria-hidden="true">?</span>
        </button>

        <button
          type="button"
          class="toolbar-action"
          [attr.aria-label]="'settings.open' | translate"
          (click)="settingsDialog.open()"
        >
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <main class="shell__content">
      <app-workspace-tabs />
    </main>
  </div>
</div>

<section class="voice-conversation" data-testid="voice-conversation">
  <div class="voice-conversation__actions">
    <button type="button" data-testid="voice-conversation-toggle" [class.chat-tool]="compact()"
      [attr.aria-pressed]="voice.enabled()"
      [attr.title]="(voice.enabled() ? 'voice.conversation.disable' : 'voice.conversation.enable') | translate"
      [attr.aria-label]="(voice.enabled() ? 'voice.conversation.disable' : 'voice.conversation.enable') | translate"
      [disabled]="!voice.enabled() && (store.sending() || store.busy() || store.loading() || !voiceReady() || recording())"
      (click)="toggleRequested.emit()">
      @if (compact()) { <span aria-hidden="true">☏</span> }
      @else { {{ (voice.enabled() ? 'voice.conversation.disable' : 'voice.conversation.enable') | translate }} }
    </button>
    @if (voice.enabled()) {
      <button type="button" data-testid="voice-conversation-stop" [class.chat-tool]="compact()"
        [attr.title]="'voice.conversation.stop' | translate"
        [attr.aria-label]="'voice.conversation.stop' | translate" (click)="stopRequested.emit()">
        @if (compact()) { <span aria-hidden="true">■</span> }
        @else { {{ 'voice.conversation.stop' | translate }} }
      </button>
    }
    @if (compact()) {
      <button type="button" class="chat-tool" data-testid="chat-voice-diagnostics-toggle"
        [attr.aria-expanded]="diagnosticsOpen()"
        [attr.aria-label]="'chat.voiceDiagnostics' | translate"
        [title]="'chat.voiceDiagnostics' | translate"
        (click)="diagnosticsOpen.update(value => !value)">
        <span aria-hidden="true">◉</span>
      </button>
    } @else {
      <span role="status" data-testid="voice-conversation-status">{{ voice.statusKey() | translate }}</span>
    }
  </div>
  @if (!compact() && voice.enabled()) {
    <p class="voice-conversation__notice">{{ 'voice.conversation.notice' | translate }}</p>
  }
  @if (!compact() || diagnosticsOpen()) {
    <div [class.voice-conversation__diagnostics]="compact()">
      <app-voice-diagnostics />
    </div>
  }
</section>

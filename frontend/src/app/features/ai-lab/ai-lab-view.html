<section class="ai-lab-view">
  <header class="ai-lab-view__header">
    <h2>{{ 'lab.title' | translate }}</h2>
    <p>{{ 'lab.description' | translate }}</p>
  </header>

  <div class="ai-lab-view__panel">
    <p class="ai-lab-view__status" role="status">
      {{ 'lab.status' | translate }}
    </p>

    <div class="ai-lab-view__actions">
      <button type="button" disabled>
        {{ 'lab.play' | translate }}
      </button>

      <button type="button" disabled>
        {{ 'lab.stop' | translate }}
      </button>
    </div>

    <p class="ai-lab-view__approval">
      {{ 'lab.approval' | translate }}
    </p>
  </div>
</section>

<app-ai-training-panel />

<app-ai-lab-workspace />

<section class="jarvis-lab-ux" data-testid="jarvis-lab-ux" [attr.aria-label]="'lab.dashboard.aria' | translate">
  <header class="jarvis-lab-ux__header">
    <div class="jarvis-lab-ux__heading">
      <p class="jarvis-lab-ux__eyebrow">J.A.R.V.I.S. / AI LAB</p>
      <h2>{{ 'lab.dashboard.title' | translate }}</h2>
      <p>{{ 'lab.cleanup.intro' | translate }}</p>
    </div>
  </header>

  <details class="jarvis-lab-ux__section" data-testid="ai-lab-research-section">
    <summary>{{ 'lab.dashboard.researchSection' | translate }}</summary>
    <div class="jarvis-lab-ux__section-content">
      <app-research-memory />
    </div>
  </details>

  <details class="jarvis-lab-ux__section" data-testid="ai-lab-training-section" (toggle)="onTrainingToggle($event)">
    <summary>{{ 'lab.cleanup.trainingSection' | translate }}</summary>
    @if (trainingOpen()) {
    <div class="jarvis-lab-ux__section-content jarvis-lab-ux__section-content--training">
      <app-lora-evidence />
      <app-lora-training />
    </div>
    }
  </details>

  <details class="jarvis-lab-ux__section" data-testid="ai-lab-agent-section">
    <summary>{{ 'lab.dashboard.agentsSection' | translate }}</summary>
    <div class="jarvis-lab-ux__section-content">
      <app-agent-planner />
    </div>
  </details>
</section>

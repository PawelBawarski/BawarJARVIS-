<div class="connectivity-toolbar">
  <span
    class="connectivity-toolbar__indicator"
    data-testid="network-state"
    role="status"
    [class.connectivity-toolbar__indicator--online]="network.status() === 'online'"
    [class.connectivity-toolbar__indicator--offline]="network.isOffline()"
    [attr.aria-label]="(
      network.status() === 'online' ? 'network.online'
      : network.status() === 'offline' ? 'network.offline'
      : network.status() === 'checking' ? 'network.checking'
      : 'network.unverified'
    ) | translate"
    [attr.title]="(
      network.status() === 'online' ? 'network.online'
      : network.status() === 'offline' ? 'network.offline'
      : network.status() === 'checking' ? 'network.checking'
      : 'network.unverified'
    ) | translate"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      @if (network.isOffline()) {
        <path d="M2 2 22 22" />
        <path d="M3 9a14 14 0 0 1 14-2" />
        <path d="M6 13a10 10 0 0 1 8-2" />
        <path d="M10 17a3 3 0 0 1 4 0" />
      } @else {
        <path d="M2 9a15 15 0 0 1 20 0" />
        <path d="M5 13a10 10 0 0 1 14 0" />
        <path d="M9 17a4 4 0 0 1 6 0" />
      }
    </svg>
    @if (network.status() === 'checking' || network.status() === 'unverified') {
      <span class="connectivity-toolbar__mark" aria-hidden="true">?</span>
    }
  </span>
</div>

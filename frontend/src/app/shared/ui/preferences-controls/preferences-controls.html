<section class="preferences">
  <div class="preferences__row">
    <span>{{ 'settings.theme' | translate }}</span>

    <button type="button" class="theme-button" (click)="theme.toggleTheme()">
      @if (theme.theme() === 'dark') {
        ☾ {{ 'settings.dark' | translate }}
      } @else {
        ☀ {{ 'settings.light' | translate }}
      }
    </button>
  </div>

  <div class="preferences__row">
    <span>{{ 'settings.language' | translate }}</span>

    <div class="language-options" role="group" [attr.aria-label]="'settings.language' | translate">
      @for (language of languages; track language) {
        <button
          type="button"
          [attr.lang]="language"
          [attr.aria-pressed]="translation.language() === language"
          [disabled]="translation.loading()"
          (click)="selectLanguage(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </div>

  @if (languageError()) {
    <p class="preferences__error" role="alert">
      {{ 'settings.languageLoadError' | translate }}
    </p>
  }
</section>

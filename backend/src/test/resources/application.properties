# Testy Maven korzystaja z H2 w pamieci, NIE z prywatnej bazy PostgreSQL.
# MODE=PostgreSQL pomaga testowac przenosny SQL; nie zastepuje integracji z prawdziwym PostgreSQL.
spring.datasource.url=jdbc:h2:mem:jarvis_tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.datasource.hikari.connection-init-sql=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE

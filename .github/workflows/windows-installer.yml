name: JARVIS Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Install desktop
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expected = "v$($package.version)"

          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag must match $expected"
          }

      - name: Build installer
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run installer:win

      - name: Verify updater files
        shell: pwsh
        run: |
          $files = @(
            "desktop/release/latest.yml"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing update file: $file"
            }
          }

          if (-not (Get-ChildItem "desktop/release/*.exe")) {
            throw "Missing Windows installer"
          }

          if (-not (Get-ChildItem "desktop/release/*.blockmap")) {
            throw "Missing update blockmap"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            desktop/release/JARVIS-Setup-*.exe
            desktop/release/JARVIS-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows
          path: release

      - name: Verify Windows signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/JARVIS-Setup-*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            throw "Installer not found"
          }

          $signature = Get-AuthenticodeSignature $installer.FullName

          if ($signature.Status -ne 'Valid') {
            throw "A trusted code signature is required for public auto-updates"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/JARVIS-Setup-*.exe
            release/JARVIS-Setup-*.exe.blockmap
            release/latest.yml

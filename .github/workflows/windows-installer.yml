name: JARVIS Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Install desktop
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Test release tooling
        working-directory: desktop
        run: npm run test:release-tools

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expected = "v$($package.version)"

          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag must match $expected"
          }

      # Runtime assets are intentionally ignored by Git. A runner must receive
      # reviewed staging before this check; never fall back to the UI-only build.
      - name: Prepare UI for staging verification
        working-directory: desktop
        run: npm run build:ui

      - name: Verify trusted runtime staging
        run: python tools/desktop17/package_windows_17_5.py --verify

      - name: Build complete installer and verify artifact
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run installer:stage17-5

      - name: Verify updater files
        shell: pwsh
        run: |
          $files = @(
            "dist/jarvis-17-5/latest.yml",
            "dist/jarvis-17-5/stage17-5-build.json"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing update file: $file"
            }
          }

          if (-not (Get-ChildItem "dist/jarvis-17-5/J.A.R.V.I.S.-Setup-*.exe")) {
            throw "Missing Windows installer"
          }

          if (-not (Get-ChildItem "dist/jarvis-17-5/J.A.R.V.I.S.-Setup-*.exe.blockmap")) {
            throw "Missing update blockmap"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/jarvis-17-5/J.A.R.V.I.S.-Setup-*.exe
            dist/jarvis-17-5/J.A.R.V.I.S.-Setup-*.exe.blockmap
            dist/jarvis-17-5/latest.yml
            dist/jarvis-17-5/stage17-5-build.json
          if-no-files-found: error

  release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows
          path: release

      - name: Verify Windows signature
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "release/J.A.R.V.I.S.-Setup-*.exe")

          if ($installers.Count -ne 1) {
            throw "Exactly one installer is required"
          }
          $installer = $installers[0]
          $manifest = Get-Content -LiteralPath "release/stage17-5-build.json" -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.schema -ne 'jarvis.17.5.build.v1' -or
              $manifest.installer -cne $installer.Name -or
              $manifest.size -ne $installer.Length -or
              $manifest.sha256 -cne $actualHash -or
              $manifest.model_bundled -ne $false) {
            throw "Installer does not match the verified build manifest"
          }

          # Static packaging verification always leaves this false. A completed,
          # independently reviewed Windows/manual Release Gate is still required;
          # this workflow must not turn a successful build into release approval.
          if ($manifest.github_release_upload_ready -isnot [bool] -or
              $manifest.github_release_upload_ready -ne $true) {
            throw "Publication blocked: full Windows/manual Release Gate has not approved this artifact"
          }

          $signature = Get-AuthenticodeSignature $installer.FullName

          if ($signature.Status -ne 'Valid') {
            throw "A trusted code signature is required for public auto-updates"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/J.A.R.V.I.S.-Setup-*.exe
            release/J.A.R.V.I.S.-Setup-*.exe.blockmap
            release/latest.yml
            release/stage17-5-build.json
